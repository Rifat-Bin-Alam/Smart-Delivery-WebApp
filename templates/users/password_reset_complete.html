{% extends 'base.html' %}

{% block title %}Password Reset Complete - {{ BRAND_NAME }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-5">
                <div class="rounded-circle bg-success-subtle text-success mx-auto d-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
                    <i class="fas fa-check-double fa-2x"></i>
                </div>
                <h4 class="fw-bold text-navy mb-2">Password Reset Successful</h4>
                <p class="text-muted small mb-4">Your new password has been confirmed. You may now sign in with your updated credentials.</p>
                <a href="{% url 'users:login' %}" class="btn btn-primary rounded-pill px-4">
                    Sign In Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
