{% extends 'base.html' %}

{% block title %}Reset Link Sent - {{ BRAND_NAME }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-5">
                <div class="rounded-circle bg-info-subtle text-info mx-auto d-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
                    <i class="fas fa-paper-plane fa-2x"></i>
                </div>
                <h4 class="fw-bold text-navy mb-2">Check Your Email</h4>
                <p class="text-muted small mb-4">
                    If an account exists with the email address you entered, we have sent instructions for resetting your password.
                </p>
                <a href="{% url 'users:login' %}" class="btn btn-primary rounded-pill px-4">
                    Return to Sign In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
