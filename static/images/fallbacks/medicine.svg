  <rect x="120" y="235" width="160" height="28" rx="14" fill="#0F172A"/>
  <text x="200" y="253" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">PHARMACY &amp; HEALTH</text>
</svg>
