      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#foodGrad)"/>
  <circle cx="200" cy="135" r="75" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(37,99,235,0.08))"/>
