  <path d="M 200 92 Q 203 82 198 75" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 212 95 Q 215 85 210 78" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Text Label -->
  <rect x="130" y="235" width="140" height="28" rx="14" fill="#0F172A"/>
  <text x="200" y="253" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">FOOD &amp; MEALS</text>
