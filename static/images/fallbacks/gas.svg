      <stop offset="100%" stop-color="#FFEDD5" />
    </linearGradient>
    <linearGradient id="cylGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#gasGrad)"/>
  <circle cx="200" cy="135" r="75" fill="#FFFFFF" stroke="#FED7AA" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(234,88,12,0.08))"/>
