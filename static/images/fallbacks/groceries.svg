<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#grocGrad)"/>
  <circle cx="200" cy="135" r="75" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(22,163,74,0.08))"/>
  <!-- Shopping Bag -->
  <rect x="165" y="115" width="70" height="65" rx="8" fill="url(#bagGrad)"/>
  <path d="M 182 115 C 182 98, 218 98, 218 115" stroke="#15803D" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Apple / Fresh Produce Icon inside bag -->
  <circle cx="190" cy="145" r="12" fill="#EF4444"/>
  <path d="M 190 133 C 192 128, 196 128, 196 130" stroke="#15803D" stroke-width="2" fill="none"/>
  <!-- Leaf -->
  <path d="M 215 138 C 220 132, 226 135, 224 142 C 220 144, 216 142, 215 138 Z" fill="#86EFAC"/>
  <!-- Text Label -->
  <rect x="120" y="235" width="160" height="28" rx="14" fill="#0F172A"/>
  <text x="200" y="253" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">GROCERIES &amp; FRESH</text>
</svg>
